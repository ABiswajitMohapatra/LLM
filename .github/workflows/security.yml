name: Security Scan

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  bandit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Security Scan
        run: |
          bandit -r . -x ./venv,./.venv